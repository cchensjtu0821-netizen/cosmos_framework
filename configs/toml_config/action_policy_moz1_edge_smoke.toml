# Minimal 8-GPU data/model-path smoke for the provisional MOZ1 Edge recipe.
# Required environment variables:
#   MOZ1_ROOT             LeRobot-v3 dataset root
#   BASE_CHECKPOINT_PATH  Cosmos3-Edge DCP root containing model/*.distcp
#   EDGE_HF_CHECKPOINT    Local Edge Policy snapshot containing processor files
#   WAN_VAE_PATH          Wan2.2_VAE.pth
#   IMAGINAIRE_OUTPUT_ROOT

[job]
task       = "vfm"
experiment = "action_policy_moz1_edge"
project    = "cosmos3_action"
group      = "action_sft"
name       = "action_policy_moz1_edge_smoke"
wandb_mode = "disabled"

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[trainer]
max_iter        = 10
logging_iter    = 1
grad_accum_iter = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 10
